<!-- @dsCard group="Data display" height=190 subtitle="Headline number with sparkline and delta" -->
<style>
  html, body { margin: 0; background: var(--canvas); }
  .stage { font-family: var(--font-sans); padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stage--canvas { background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px); background-size: 20px 20px; }
  .lbl { font: 500 11px/16px var(--font-sans); color: var(--text-tertiary); margin-bottom: 8px; letter-spacing: .3px; text-transform: uppercase; }
  .stage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1040px}
</style>
<div class="aui stage" id="stage"></div>
<script>
(function(){ var U = window.AgentUI; var S = document.getElementById('stage'); 
  S.appendChild(U.StatTile({label:'Runs', icon:'play', value:'42', delta:{text:'+31%', good:true}, series:[3,5,4,7,6,9,8]}));
  S.appendChild(U.StatTile({label:'Latency · p50', icon:'clock', value:'2.4', unit:'s', delta:{text:'-12%', good:true}, series:[3.1,2.9,3.0,2.6,2.7,2.4,2.4]}));
  S.appendChild(U.StatTile({label:'Tokens', icon:'tokens', value:'48,210', delta:{text:'+9%', good:false}, series:[5,6,6,7,8,8,9]}));
  S.appendChild(U.StatTile({label:'Pass rate', icon:'check', value:'92', unit:'%', delta:null, foot:'34 of 37 graded', series:[.8,.9,.85,1,.9,.95,.92]}));
 })();
</script>
