<!-- @dsCard group="Chrome" height=120 subtitle="Floating canvas toolbar: pan, select, undo, redo" -->
<style>
  html, body { margin: 0; background: var(--canvas); }
  .stage { font-family: var(--font-sans); padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stage--canvas { background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px); background-size: 20px 20px; }
  .lbl { font: 500 11px/16px var(--font-sans); color: var(--text-tertiary); margin-bottom: 8px; letter-spacing: .3px; text-transform: uppercase; }
  
</style>
<div class="aui stage" id="stage"></div>
<script>
(function(){ var U = window.AgentUI; var S = document.getElementById('stage'); 
  S.appendChild(U.Toolbar([{icon:'hand', label:'Pan mode', pressed:true},{icon:'cursor', label:'Selection mode'},{icon:'undo', label:'Undo', disabled:true},{icon:'redo', label:'Redo', disabled:true}]));
 })();
</script>
