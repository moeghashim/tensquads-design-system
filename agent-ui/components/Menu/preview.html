<!-- @dsCard group="Data display" height=200 subtitle="Actions menu with a danger item after a separator" -->
<style>
  html, body { margin: 0; background: var(--canvas); }
  .stage { font-family: var(--font-sans); padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .stage--canvas { background-image: radial-gradient(var(--dot-grid) 1px, transparent 1px); background-size: 20px 20px; }
  .lbl { font: 500 11px/16px var(--font-sans); color: var(--text-tertiary); margin-bottom: 8px; letter-spacing: .3px; text-transform: uppercase; }
  .stage{display:block;position:relative;min-height:160px}.wrap{position:relative;display:inline-block}
</style>
<div class="aui stage" id="stage"><div class="wrap" id="w"></div></div>
<script>
(function(){ var U = window.AgentUI; var S = document.getElementById('stage'); 
  var w = document.getElementById('w'); w.appendChild(U.Button({icon:'more', variant:'ghost', iconOnly:true, pill:true, ariaLabel:'Actions'}));
  var m = U.Menu([{label:'Open', icon:'pencil'},{label:'Duplicate', icon:'copy'},{label:'Publish', icon:'check'},{sep:true},{label:'Delete', icon:'trash', danger:true}]); m.style.left='0'; m.style.right='auto'; w.appendChild(m);
 })();
</script>
